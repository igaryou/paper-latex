name: Build and Push TeX Live Image

on:
  workflow_dispatch:

  schedule:
    # 毎月1日 00:00 UTC
    - cron: "0 0 1 * *"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/texlive-base

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Set image tag
        run: |
          echo "IMAGE_TAG=$(date +%Y)" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (local for testing)
        uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          load: true
          tags: texlive-base:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test latexmk
        run: |
          docker run --rm texlive-base:test latexmk --version

      - name: Test pdflatex
        run: |
          docker run --rm texlive-base:test pdflatex --version

      - name: Create test document
        run: |
          mkdir testdoc

          cat > testdoc/main.tex <<'EOF'
          \documentclass{article}
          \begin{document}
          Hello, TeX Live!
          \end{document}
          EOF

      - name: Compile test document
        run: |
          docker run --rm \
            -v "$PWD/testdoc:/work" \
            -w /work \
            texlive-base:test \
            latexmk -pdf main.tex

      - name: Verify PDF exists
        run: |
          test -f testdoc/main.pdf

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max